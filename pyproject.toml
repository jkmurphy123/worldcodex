[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldbld"
version = "0.1.0"
description = "World building data pack CLI (WorldPack) for authors and generator pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
]

[project.scripts]
world = "worldbld.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
